apiVersion: 1

# Dashboard provider for the FlowCharting Demo_Stack (Req 9.5).
# Grafana loads every dashboard JSON found under the configured path on startup.
providers:
  - name: FlowCharting demo
    orgId: 1
    folder: FlowCharting
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
